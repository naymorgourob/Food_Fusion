<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFusion — Modern Fine Dining</title>
    <meta
      name="description"
      content="FoodFusion is a premium restaurant serving seasonal, chef-driven plates. Dine in, order delivery, or reserve your table online."
    />
    <!-- Emerald, matching --color-brand-700 in styles/index.css -->
    <meta name="theme-color" content="#0B5D46" />

    <!-- Poppins for headings, Inter for body. preconnect first so the font
         request isn't waiting on DNS + TLS before it can even start. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
